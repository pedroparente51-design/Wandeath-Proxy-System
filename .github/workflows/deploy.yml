name: 🚀 Deploy SSH
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Atualizando VPS
        uses: appleboy/ssh-action@master
        with:
          host: 89.117.79.191
          username: deployer
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            TARGET="wandeath.com"
            echo "📂 Entrando na pasta /var/www/$TARGET..."
            cd /var/www/$TARGET
            
            echo "⚙️ Configurando diretório seguro..."
            git config --global --add safe.directory /var/www/$TARGET
            
            echo "📥 Sincronizando com o repositório Wandeath..."
            git remote set-url origin git@github.com:pedroparente51-design/wandeath.git || git remote add origin git@github.com:pedroparente51-design/wandeath.git
            
            echo "📥 Buscando atualizações..."
            git fetch --all
            
            echo "🧹 Resetando para a versão mais recente do Wandeath..."
            git reset --hard origin/main
            
            echo "✨ Limpando arquivos não rastreados..."
            git clean -fd
            
            echo "🔑 Ajustando permissões..."
            # Usando sudo para garantir que as permissões sejam aplicadas
            sudo chown -R deployer:www-data /var/www/$TARGET
            sudo chmod -R 775 /var/www/$TARGET
            
            echo "🌐 Recarregando Nginx..."
            sudo systemctl reload nginx
            
            echo "✅ DEPLOY FINALIZADO COM SUCESSO!"