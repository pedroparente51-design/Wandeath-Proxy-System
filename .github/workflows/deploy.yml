name: 🚀 Deploy SSH
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Atualizando VPS
        uses: appleboy/ssh-action@master
        with:
          host: 89.117.79.191
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            TARGET="wandeath.com"
            cd /var/www/$TARGET || exit 1
            
            # Garante que o git não reclame de permissão
            git config --global --add safe.directory /var/www/$TARGET
            
            # Sincroniza com o GitHub via HTTPS (Garante que não falhe por falta de chave SSH interna)
            git fetch origin main
            git reset --hard origin/main
            
            # Ajusta permissões para o usuário 'deployer'
            chown -R deployer:www-data /var/www/$TARGET
            chmod -R 775 /var/www/$TARGET
            
            # Recarrega o Nginx
            systemctl reload nginx
            echo "🚀 Deploy concluído com sucesso em $TARGET!"
