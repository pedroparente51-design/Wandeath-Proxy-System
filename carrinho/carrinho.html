<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Carrinho - Wandeath VIP</title>
    <link rel="stylesheet" href="./carrinho.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="rx-theme-rh7">
    <div id="mouse-glow"></div>
    <div class="mesh-gradient"></div>
    <div class="grid-overlay"></div>

    <!-- Interactive BG Wrapper for Parallax Shapes -->
    <div class="interactive-bg-wrapper" id="parallax-bg">
        <div class="parallax-shape shape-1"></div>
        <div class="parallax-shape shape-2"></div>
        <div class="parallax-shape shape-3"></div>
    </div>

    <!-- Floating Aurora Blobs -->
    <div class="aurora-container">
        <div class="aurora-blob aurora-blob--1"></div>
        <div class="aurora-blob aurora-blob--2"></div>
        <div class="aurora-blob aurora-blob--3"></div>
        <div class="aurora-blob aurora-blob--4"></div>
    </div>

    <!-- Header Simples -->
    <header class="main-header">
        <div class="container header-inner">
            <a href="../index.html" class="logo">
                <img src="../image.png" alt="Wandeath VIP">
            </a>
            <div class="header-right">
                <a href="../index.html" class="header-user-btn">
                    <i data-lucide="arrow-left"></i>
                    <span>Continuar Comprando</span>
                </a>
            </div>
        </div>
    </header>

    <main class="checkout-page">
        <div class="container">
            <h1 class="checkout-title">Seu <span>Carrinho</span></h1>
            
            <div class="checkout-grid" id="main-checkout-grid">
                <!-- Coluna Esquerda: Itens -->
                <div class="checkout-main">
                    <section class="checkout-section">
                        <div class="section-header">
                            <i data-lucide="shopping-bag"></i>
                            <h4>Itens no Carrinho</h4>
                        </div>
                        <div class="cart-items" id="cart-items-list">
                            <!-- Injetado via JS -->
                            <div class="loader-box">
                                <div class="loader"></div>
                            </div>
                        </div>
                    </section>

                    <section class="checkout-section">
                        <div class="section-header">
                            <i data-lucide="user"></i>
                            <h4>Seus Dados</h4>
                        </div>
                        <div class="checkout-form-box">
                            <div class="form-group">
                                <label>Nome Completo</label>
                                <input type="text" id="checkout-name" placeholder="Digite seu nome">
                            </div>
                            <div class="form-group">
                                <label>E-mail de Entrega</label>
                                <input type="email" id="checkout-email" placeholder="seu@email.com">
                            </div>
                        </div>
                    </section>
                </div>

                <!-- Coluna Direita: Resumo -->
                <div class="checkout-sidebar">
                    <div class="order-summary-card">
                        <div class="summary-header">
                            <h4>Resumo</h4>
                            <i data-lucide="shield-check"></i>
                        </div>

                        <div id="cart-summary-items" class="summary-items-list">
                            <!-- Injetado via JS -->
                        </div>

                        <div class="coupon-area">
                            <label>Cupom de Desconto</label>
                            <div class="coupon-input-group">
                                <input type="text" id="cart-coupon-input" placeholder="CÓDIGO">
                                <button onclick="applyCartCoupon()">Aplicar</button>
                            </div>
                            <div id="coupon-msg" style="margin-top: 10px; font-size: 12px; font-weight: 700;"></div>
                        </div>

                        <div class="summary-totals">
                            <div class="total-line">
                                <span>Subtotal</span>
                                <span id="cart-subtotal">R$ 0,00</span>
                            </div>
                            <div class="total-line" id="cart-discount-line" style="display:none;">
                                <span>Desconto</span>
                                <span id="cart-discount-val" style="color: #22c55e;">- R$ 0,00</span>
                            </div>
                            <div class="total-line main-total">
                                <span>Total</span>
                                <span id="cart-final-total">R$ 0,00</span>
                            </div>
                        </div>

                        <button class="btn-checkout-finalize" id="confirm-payment-btn">
                            Finalizar Compra
                            <i data-lucide="arrow-right"></i>
                        </button>

                        <div class="secure-footer">
                            <i data-lucide="lock"></i>
                            Pagamento 100% Seguro via Mercado Pago
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="./carrinho.js"></script>
</body>
</html>
