<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - Wandeath VIP</title>
    <link rel="icon" type="image/x-icon" href="/logo.ico">
    <link rel="stylesheet" href="/home.css?v=2.0.3">
    <link rel="stylesheet" href="/login/login.css?v=2.0.3">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/lucide@0.321.0/dist/umd/lucide.min.js"></script>
</head>

<body class="rx-theme-rh7">
    <!-- Reusing the background from index.html -->
    <div class="mesh-gradient"></div>
    <div class="grid-overlay"></div>
    <div id="mouse-glow"></div>
    <canvas id="particles-canvas"></canvas>

    <!-- Interactive BG Wrapper for Parallax Shapes -->
    <div class="interactive-bg-wrapper" id="parallax-bg">
        <div class="parallax-shape shape-1"></div>
        <div class="parallax-shape shape-2"></div>
        <div class="parallax-shape shape-3"></div>
    </div>

    <!-- Floating Aurora Blobs -->
    <div class="aurora-container">
        <div class="aurora-blob aurora-blob--1"></div>
        <div class="aurora-blob aurora-blob--2"></div>
        <div class="aurora-blob aurora-blob--3"></div>
        <div class="aurora-blob aurora-blob--4"></div>
    </div>

    <div class="login-container" style="opacity: 1 !important; visibility: visible !important;">
        <div class="auth-card">
            <a href="/">
                <img src="/image.png" alt="RH7 PROXYS" class="auth-logo">
            </a>

            <h2 id="auth-title">Acesse sua conta</h2>
            <p class="subtitle" id="auth-subtitle">Seja bem-vindo de volta ao ecossistema VIP.</p>

            <div class="social-group">
                <a href="#" class="btn-social btn-google">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18" alt="Google">
                    Entrar com Google
                </a>
                <a href="#" class="btn-social btn-discord">
                    <i data-lucide="message-square"></i>
                    Entrar com Discord
                </a>
            </div>

            <div class="divider" id="auth-divider">OU COM E-MAIL</div>

            <!-- Login Form -->
            <form id="login-form" action="#" method="POST">
                <div class="input-group">
                    <label>E-mail</label>
                    <input type="email" placeholder="seu@email.com" required>
                </div>
                <div class="input-group">
                    <label>Senha</label>
                    <input type="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-submit">ENTRAR NA CONTA</button>
            </form>

            <!-- Register Form (Hidden by default) -->
            <form id="register-form" action="#" method="POST" style="display: none;">
                <div class="input-group">
                    <label>Nome Completo</label>
                    <input type="text" placeholder="Como quer ser chamado?" required>
                </div>
                <div class="input-group">
                    <label>E-mail</label>
                    <input type="email" placeholder="seu@melhor-email.com" required>
                </div>
                <div class="input-group">
                    <label>Senha</label>
                    <input type="password" placeholder="Crie uma senha forte" required>
                </div>
                <button type="submit" class="btn-submit">CRIAR MINHA CONTA</button>
            </form>

            <div class="auth-footer" id="auth-footer-text">
                Não tem uma conta? <a href="#" onclick="toggleAuth(event)">Crie agora</a>
            </div>
        </div>
    </div>
    <!-- Chatbox Component -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/supabase-config.js?v=2.0.3"></script>
    <script src="/login/login.js?v=2.0.3"></script>

    <!-- Chatbox Component -->
    <link rel="stylesheet" href="/chat/chatbox.css?v=2.0.3">
    <script src="/chat/chatbox.js?v=2.0.3"></script>

</body>

</html>
