<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Minhas Compras - Wandeath VIP</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="./pedidos.css">
</head>

<body>
    <div class="grid-overlay"></div>
    <div class="rx-topbar">
        <a class="rx-topbar__link" href="../index.html">🔥MELHORES PROXYS • SUPORTE RÁPIDO • 100% AUTOMÁTICO</a>
    </div>

    <header class="main-header">
        <div class="container header-inner">
            <a href="../index.html" class="logo">
                <img src="../image.png" alt="Wandeath VIP">
            </a>
            <div class="header-right">
                <a href="../index.html" class="header-user-btn">
                    <i data-lucide="arrow-left"></i>
                    <span>Voltar à Loja</span>
                </a>
            </div>
        </div>
    </header>

    <main class="page-wrap">
        <div class="container">
            <div class="page-header">
                <h1>Minhas <span>Compras</span></h1>
                <p>Todas suas compras efetuadas com entrega automática.</p>
            </div>

            <div id="orders-container" class="orders-list">
                <!-- Orders render here -->
            </div>
        </div>
    </main>

    <!-- Details Modal -->
    <div id="details-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title">Produtos Recebidos</h2>
                <button class="btn-close" onclick="closeModal()">&times;</button>
            </div>
            <div id="delivery-box" class="delivery-box">
                <!-- Items list -->
            </div>
            <div class="modal-footer">
                <button id="btn-copy-all" class="btn-copy-all">
                    <i data-lucide="copy"></i> Copiar Tudo
                </button>
            </div>
        </div>
    </div>

    <!-- Floating WA -->
    <a href="javascript:void(0);" class="wa-floating" id="open-chat-btn">
        <i data-lucide="message-circle"></i>
    </a>

    <!-- Real-time Chatbox -->
    <div class="chatbox-container" id="chatbox-container">
        <div class="chatbox-header">
            <div class="chatbox-header-info">
                <i data-lucide="headset"></i>
                <div>
                    <h4>Suporte Ao Vivo</h4>
                    <span class="status-indicator"></span><small>Online agora</small>
                </div>
            </div>
            <button class="chatbox-close" id="close-chat-btn"><i data-lucide="x"></i></button>
        </div>
        <div class="chatbox-messages" id="chatbox-messages">
            <!-- Messages will be injected here -->
        </div>
        <div class="chatbox-input">
            <input type="text" id="chatbox-input-field" placeholder="Digite sua mensagem...">
            <button id="chatbox-send-btn"><i data-lucide="send"></i></button>
        </div>
    </div>

    <script src="../home.js"></script>
    <script src="./pedidos.js"></script>
</body>

</html>
