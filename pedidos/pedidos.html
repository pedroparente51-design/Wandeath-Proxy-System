<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Minhas Compras - Wandeath VIP</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --primary: #ee0000;
            --bg-black: #0d0d0d;
            --bg-card: rgba(10,10,10,0.85);
            --border: rgba(255,255,255,0.06);
            --text-main: #ffffff;
            --text-sec: #8c8c8c;
            --font-main: 'Plus Jakarta Sans', sans-serif;
            --header-h: 72px;
            --topbar-h: 40px;
            --radius: 14px;
        }
        * { margin:0; padding:0; box-sizing:border-box; font-family:var(--font-main); }
        html,body { background:#0a0a0a; color:var(--text-main); overflow-x:hidden; min-height: 100vh; }

        /* Background Effects */
        .grid-overlay { position:fixed; top:0; left:0; width:100%; height:100%; background-image: radial-gradient(var(--border) 1px, transparent 1px); background-size: 30px 30px; pointer-events:none; z-index:0; }

        /* Topbar */
        .rx-topbar { height:var(--topbar-h); background:#000; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:center; position:fixed; top:0; width:100%; z-index:2001; }
        .rx-topbar__link { color:var(--primary); text-decoration:none; font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:1px; }

        /* Header */
        .main-header { height:var(--header-h); background:rgba(10,10,10,0.85); backdrop-filter:blur(15px); border-bottom:1px solid var(--border); position:fixed; top:var(--topbar-h); width:100%; z-index:2000; }
        .header-inner { display:flex; align-items:center; justify-content:space-between; height:100%; }
        .container { max-width:1200px; margin:0 auto; padding:0 24px; position:relative; z-index:1; }
        .logo img { height:110px; width:auto; }
        .header-right { display:flex; align-items:center; gap:15px; }
        .header-user-btn { background:transparent; border:1px solid var(--border); color:#fff; text-decoration:none; padding:10px 20px; border-radius:8px; font-size:13px; font-weight:700; display:flex; align-items:center; gap:10px; transition:0.3s; }
        .header-user-btn:hover { background:#fff; color:#000; }

        /* Page Content */
        .page-wrap { padding: calc(var(--topbar-h) + var(--header-h) + 60px) 0 100px; }
        .page-header { margin-bottom:40px; }
        .page-header h1 { font-size:36px; font-weight:800; margin-bottom:8px; letter-spacing:-1px; }
        .page-header h1 span { color:var(--primary); }
        .page-header p { color:var(--text-sec); font-size:15px; }

        /* Orders List */
        .orders-list { display:flex; flex-direction:column; gap:24px; }
        .order-card { background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius); padding:25px; transition:0.3s; }
        .order-card:hover { border-color:rgba(255,255,255,0.1); transform:translateY(-2px); }

        .order-card-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; }
        .order-info h3 { font-size:18px; font-weight:800; margin-bottom:4px; }
        .order-date { font-size:12px; color:var(--text-sec); font-weight:600; text-transform:uppercase; letter-spacing:0.5px; }
        
        .order-status { display:flex; align-items:center; gap:8px; background:rgba(34,197,94,0.1); border:1px solid rgba(34,197,94,0.2); color:#22c55e; font-size:11px; font-weight:800; padding:6px 14px; border-radius:50px; text-transform:uppercase; }
        .order-status i { width:14px; }

        .order-details { display:flex; align-items:center; justify-content:space-between; border-top:1px solid var(--border); padding-top:20px; }
        .order-qty { font-size:14px; color:var(--text-sec); font-weight:600; }
        .order-total { font-size:18px; font-weight:800; color:#fff; }
        
        .btn-view { background:rgba(255,255,255,0.05); border:1px solid var(--border); color:#fff; padding:10px 20px; border-radius:10px; font-size:13px; font-weight:700; cursor:pointer; transition:0.3s; display:flex; align-items:center; gap:8px; }
        .btn-view:hover { border-color:var(--primary); color:var(--primary); }

        /* Modal Details */
        .modal { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); backdrop-filter:blur(10px); display:none; align-items:center; justify-content:center; z-index:3000; padding:20px; }
        .modal.show { display:flex; }
        .modal-content { background:linear-gradient(145deg, #111, #050505); border:1px solid var(--border); border-radius:20px; width:100%; max-width:600px; padding:35px; position:relative; box-shadow:0 30px 60px rgba(0,0,0,0.5); }
        .modal-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:25px; }
        .modal-header h2 { font-size:22px; font-weight:800; }
        .btn-close { background:none; border:none; color:var(--text-sec); font-size:30px; cursor:pointer; }
        
        .delivery-box { background:rgba(255,255,255,0.02); border:1px solid var(--border); border-radius:12px; padding:20px; max-height:400px; overflow-y:auto; }
        .delivery-item { display:flex; align-items:center; gap:12px; background:rgba(255,255,255,0.03); border:1px solid var(--border); border-radius:8px; padding:12px; margin-bottom:10px; }
        .delivery-num { font-size:11px; font-weight:800; color:var(--text-sec); min-width:20px; }
        .delivery-text { flex:1; font-family:monospace; font-size:13px; color:#ccc; word-break:break-all; }
        .btn-copy-mini { background:rgba(238,0,0,0.1); border:1px solid rgba(238,0,0,0.2); color:var(--primary); font-size:10px; font-weight:800; padding:6px 12px; border-radius:6px; cursor:pointer; text-transform:uppercase; transition:0.3s; }
        .btn-copy-mini:hover { background:var(--primary); color:#fff; }

        .modal-footer { display:flex; gap:15px; margin-top:25px; }
        .btn-copy-all { flex:1; background:var(--primary); color:#fff; border:none; padding:15px; border-radius:10px; font-weight:800; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:10px; }
        
        /* Empty State */
        .empty-state { text-align:center; padding:100px 20px; }
        .empty-state h3 { font-size:24px; margin-bottom:12px; }
        .empty-state p { color:var(--text-sec); margin-bottom:30px; }
        .btn-primary { background:var(--primary); color:#fff; text-decoration:none; padding:14px 35px; border-radius:10px; font-weight:800; display:inline-block; transition:0.3s; }
        .btn-primary:hover { transform:translateY(-2px); box-shadow:0 10px 20px rgba(238,0,0,0.3); }

        /* Animation */
        @keyframes slideUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
        .order-card { animation: slideUp 0.4s ease forwards; }
    </style>
</head>
<body>
    <div class="grid-overlay"></div>
    <div class="rx-topbar">
        <a class="rx-topbar__link" href="../home/index.html">🔥 WANDEATH VIP • MELHORES PROXYS • SUPORTE RÁPIDO • 100% AUTOMÁTICO</a>
    </div>

    <header class="main-header">
        <div class="container header-inner">
            <a href="../home/index.html" class="logo">
                <img src="../image.png" alt="Wandeath VIP">
            </a>
            <div class="header-right">
                <a href="../home/index.html" class="header-user-btn">
                    <i data-lucide="arrow-left"></i>
                    <span>Voltar à Loja</span>
                </a>
            </div>
        </div>
    </header>

    <main class="page-wrap">
        <div class="container">
            <div class="page-header">
                <h1>Minhas <span>Compras</span></h1>
                <p>Todas suas compras efetuadas com entrega automática.</p>
            </div>

            <div id="orders-container" class="orders-list">
                <!-- Orders render here -->
            </div>
        </div>
    </main>

    <!-- Details Modal -->
    <div id="details-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title">Produtos Recebidos</h2>
                <button class="btn-close" onclick="closeModal()">&times;</button>
            </div>
            <div id="delivery-box" class="delivery-box">
                <!-- Items list -->
            </div>
            <div class="modal-footer">
                <button id="btn-copy-all" class="btn-copy-all">
                    <i data-lucide="copy"></i> Copiar Tudo
                </button>
            </div>
        </div>
    </div>

    <script>
        function renderOrders() {
            const container = document.getElementById('orders-container');
            const orders = JSON.parse(localStorage.getItem('wandeath_orders') || '[]');

            if (orders.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <h3>Nenhum pedido encontrado</h3>
                        <p>Você ainda não realizou nenhuma compra em nossa plataforma.</p>
                        <a href="../home/index.html#produtos" class="btn-primary">Ver Produtos</a>
                    </div>
                `;
                return;
            }

            container.innerHTML = orders.slice().reverse().map((order, index) => {
                const date = new Date(order.date);
                const dateStr = date.toLocaleDateString('pt-BR', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
                
                return `
                    <div class="order-card" style="animation-delay: ${index * 0.1}s">
                        <div class="order-card-header">
                            <div class="order-info">
                                <div class="order-date">${dateStr}</div>
                                <h3>${order.productName}</h3>
                            </div>
                            <div class="order-status">
                                <i data-lucide="check-circle"></i> Entregue
                            </div>
                        </div>
                        <div class="order-details">
                            <div class="order-qty">${order.qty || 1} unidade${(order.qty||1) > 1 ? 's' : ''}</div>
                            <div style="display:flex; align-items:center; gap:20px;">
                                <div class="order-total">R$ ${parseFloat(order.total || 0).toFixed(2)}</div>
                                <button class="btn-view" onclick="viewOrder(${orders.length - 1 - index})">
                                    <i data-lucide="eye"></i> Ver produto
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
            
            lucide.createIcons();
        }

        window.viewOrder = function(idx) {
            const orders = JSON.parse(localStorage.getItem('wandeath_orders') || '[]');
            const order = orders[idx];
            if(!order) return;

            const modal = document.getElementById('details-modal');
            const deliveryBox = document.getElementById('delivery-box');
            const title = document.getElementById('modal-title');
            const copyBtn = document.getElementById('btn-copy-all');

            title.innerText = order.productName;
            const items = order.delivery ? order.delivery.trim().split('\n').filter(Boolean) : [];
            
            deliveryBox.innerHTML = items.map((line, i) => `
                <div class="delivery-item">
                    <span class="delivery-num">${i + 1}</span>
                    <span class="delivery-text">${line}</span>
                    <button class="btn-copy-mini" onclick="copyText('${line.replace(/'/g,"\\'")}', this)">Copiar</button>
                </div>
            `).join('');

            copyBtn.onclick = () => {
                copyText(items.join('\n'), copyBtn, "Copiar Tudo", "✓ Copiado!");
            };

            modal.classList.add('show');
            lucide.createIcons();
        }

        window.copyText = function(text, btn, originalLabel = "Copiar", successLabel = "✓") {
            navigator.clipboard.writeText(text).then(() => {
                const old = btn.innerHTML;
                btn.innerText = successLabel;
                btn.style.color = "#00ff66";
                setTimeout(() => {
                    btn.innerHTML = old;
                    btn.style.color = "";
                }, 2000);
            });
        }

        window.closeModal = function() {
            document.getElementById('details-modal').classList.remove('show');
        }

        window.onclick = function(event) {
            const modal = document.getElementById('details-modal');
            if (event.target == modal) closeModal();
        }

        document.addEventListener('DOMContentLoaded', renderOrders);
    </script>
</body>
</html>
