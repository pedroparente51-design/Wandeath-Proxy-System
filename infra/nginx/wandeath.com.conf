server {
    listen 80;
    server_name wandeath.com www.wandeath.com;
    root /var/www/wandeath.com;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Logs
    access_log /var/log/nginx/wandeath.com.access.log;
    error_log /var/log/nginx/wandeath.com.error.log;

    # Cache de arquivos estáticos
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|otf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Configuração para o Supabase ou outras APIs se necessário
    # location /api/ {
    #     proxy_pass http://localhost:PORT;
    # }
}
